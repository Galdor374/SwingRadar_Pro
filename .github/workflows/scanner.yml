name: SwingRadar Pro Hourly Scan

on:
  schedule:
    - cron: "5 * * * *"   # Her saat başı :05 geçe (UTC)
  workflow_dispatch:         # GitHub'dan tek tıkla manuel tetikleme

permissions:
  contents: write

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          pip install numpy requests yfinance

      - name: Run scanner
        run: python main_scanner.py --no-browser

      - name: Commit updated state and reports
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if ! git diff --staged --quiet; then
            git commit -m "chore: update scan state and dashboards"
            git push
          fi
